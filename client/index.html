<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Živnosťapp</title>
    <link rel="icon" href="/ikona.svg" type="image/svg+xml" />
    <!-- V telefóne sa appka dá „pridať na plochu" – s vlastnou ikonou a bez lišty prehliadača. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Lišta prehliadača v telefóne má farbu hlavičky appky (biela, v tmavom režime tmavá). -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1919" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Živnosťapp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
